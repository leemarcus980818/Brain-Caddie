  <script>

      fact:"Modern CPUs can contain billions of transistors on a single chip." },

    // ---- History ----
    { id:'hist-1', category:'History',
      question:'Which of these inventions was patented or demonstrated first?',
      answer:'The telephone', acceptedAnswers:['telephone'],
      ironOptions:['The telephone','The light bulb','The airplane'],
      wedgeOptions:['The telephone','The light bulb','The airplane','Radio broadcasting'],
      hint:"Alexander Graham Bell secured his patent in 1876, three years before Edison's commercial bulb.",
      fact:"The telephone came first (1876), followed by the incandescent light bulb (1879), radio (1895), and powered flight (1903)." },

      question:'Which dynasty unified China and began construction of the first Great Wall in the 3rd century BCE?',
      answer:'Qin Dynasty', acceptedAnswers:['qin','the qin dynasty'],

    // ---- Numbers ----
    { id:'num-1', category:'Numbers',

      answer:'17%', acceptedAnswers:['17','16.7','16.7%','16.67','16.67%'],
      ironOptions:['12%','17%','25%'],
      wedgeOptions:['8%','12%','17%','25%'],
      hint:"Half of 1/3 (33.3%) gives you the exact figure.",
      fact:"1/6 equals 16.666...%, a handy benchmark when estimating splits or probabilities in meetings." },
    { id:'num-2', category:'Numbers',

      answer:'36', acceptedAnswers:['36%'],

      hint:"Find 10% first (24), then add half of that.",
      fact:"Fast trick: 10% is 24, and 5% is half of that (12). So 24 + 12 = 36." },

    // ---- Wildcard ----
    { id:'wild-1', category:'Wildcard',
      question:'In game theory, what is the name of a state where no player can benefit by changing their strategy unilaterally?',
      answer:'Nash equilibrium', acceptedAnswers:['nash'],

      wedgeOptions:['Nash equilibrium','Pareto efficiency',"Prisoner's dilemma",'Zero-sum state'],
      hint:"Named after mathematician John Nash, featured in the film 'A Beautiful Mind'.",
      fact:"A Nash equilibrium occurs when every player's strategy is optimal given the strategies everyone else has chosen." },
    { id:'wild-2', category:'Wildcard',
      question:"What does the slang acronym 'FOMO' stand for?",
      answer:'Fear of Missing Out', acceptedAnswers:['fomo'],
      ironOptions:['Fear of Missing Out','Future of Money Online','Focus on Mission Outcomes'],
      wedgeOptions:['Fear of Missing Out','Future of Money Online','Focus on Mission Outcomes','Forecast of Market Opportunity'],
      hint:"You'll see it in social posts and Slack threads about the team offsite.",
      fact:"'FOMO' entered the Oxford English Dictionary in 2013." }
  ];

  // Par and tag per hole position (the course layout never changes, only the questions do)
  const HOLE_LAYOUT = [
    { par:3, tag:'Opening Tee' }, { par:4, tag:'Fairway' },   { par:4, tag:'Fairway' },
    { par:5, tag:'Signature Hole' }, { par:3, tag:'Short Par 3' }, { par:4, tag:'Fairway' },
    { par:3, tag:'Island Green' }, { par:5, tag:'Dogleg' },    { par:4, tag:'Championship Hole' }
  ];

  const STORE_KEY = 'brainCaddie:v2';
  const CLUBS = { D:'Driver', I:'Iron', W:'Wedge' };
  const CLUB_CODE = { Driver:'D', Iron:'I', Wedge:'W' };

  // ==========================================
  // 2. SEEDED RANDOMNESS (same day = same course for everyone)
  // ==========================================
  function hashStr(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function makeRng(seed) {
    let a = hashStr(seed);
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const pick = (arr, rng) => arr[Math.floor(rng() * arr.length)];

  // ==========================================
  // 3. DATES & DAILY COURSE
  // ==========================================
  function dateKeyFor(d = new Date()) {
    return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
  }
  // Testing aid: append ?day=2030-01-01 to the URL to preview another day's course
  const DEV_DAY = /^\d{4}-\d{2}-\d{2}$/.test(new URLSearchParams(location.search).get('day') || '')
    ? new URLSearchParams(location.search).get('day') : null;
  const TODAY = DEV_DAY || dateKeyFor();

  function fmtDate(key) {
    return new Date(key + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function timeToNextCourse() {
    const now = new Date(), next = new Date(now);
    next.setHours(24, 0, 0, 0);
    const ms = next - now;
    return `$${Math.floor(ms / 3600000)}h $${Math.floor((ms % 3600000) / 60000)}m`;
  }

  // Builds the 9-hole course for a given date key. Deterministic: same key = same course.
  function buildCourse(key) {
    const rng = makeRng('brain-caddie:' + key);
    const categories = [...new Set(QUESTION_BANK.map(q => q.category))];
    const chosenCats = shuffle(categories, rng).slice(0, 9);
    const questions = chosenCats.map(cat => pick(QUESTION_BANK.filter(q => q.category === cat), rng));

    return questions.map((q, i) => ({
      hole: i + 1,
      ...HOLE_LAYOUT[i],
      id: q.id,
      category: q.category,
      question: q.question,
      answer: q.answer,
      acceptedAnswers: q.acceptedAnswers || [],
      ironOptions: shuffle(q.ironOptions, rng),
      wedgeOptions: shuffle(q.wedgeOptions, rng),
      hint: q.hint,
      fact: q.fact
    }));
  }

  // ==========================================
  // 4. SCORING HELPERS
  // ==========================================
  const relTotal = scores => scores.reduce((acc, s) => acc + (s.strokes - s.par), 0);
  const fmt = r => (r === 0 ? 'E' : r > 0 ? `+${r}` : `${r}`);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const normalize = s => String(s).toLowerCase().replace(/[^a-z0-9%.\s]/g, '').replace(/^the\s+/, '').replace(/\s+/g, ' ').trim();

  function strokesFor(club, par) {
    if (club === 'Driver') return Math.max(1, par - 2);
    if (club === 'Iron') return par - 1;
    return par;
  }
  function getScoreLabel(strokes, par) {
    const diff = strokes - par;
    if (strokes === 1) return 'Hole-in-One! 🏆';
    if (diff <= -2) return 'Eagle 🦅';
    if (diff === -1) return 'Birdie 🐦';
    if (diff === 0) return 'Par ⛳';
    return 'Bogey 😬';
  }

  // Marcus's round is simulated from the day's seed, so he changes daily too
  function simulateOpponent(course, key) {
    const rng = makeRng('marcus:' + key);
    return course.map(h => {
      const club = pick(['Driver', 'Iron', 'Wedge'], rng);
      const odds = { Driver: 0.35, Iron: 0.6, Wedge: 0.8 }[club];
      const strokes = rng() < odds ? strokesFor(club, h.par) : h.par + 1;
      return { hole: h.hole, par: h.par, strokes, club, label: getScoreLabel(strokes, h.par) };
    });
  }
  // Background "office field" for the leaderboard
  function simulateField(key) {
    const rng = makeRng('field:' + key);
    return shuffle(['Albert', 'Emily', 'Priya', 'Dev', 'Jordan'], rng).slice(0, 2)
      .map(name => ({ name, score: Math.round(rng() * 8) - 3, isUser: false }));
  }

  // ==========================================
  // 5. CHALLENGE LINKS (compact, validated)
  // ==========================================
  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }
  function b64decode(str) {
    const bin = atob(str);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  function buildChallengeURL() {
    const payload = {
      n: app.record.playerName,
      d: app.key,
      s: app.record.scores.map(s => [s.strokes, CLUB_CODE[s.club]])
    };
    return `$${location.origin}$${location.pathname}?c=${encodeURIComponent(b64encode(JSON.stringify(payload)))}`;
  }
  function parseChallenge() {
    const raw = new URLSearchParams(location.search).get('c');
    if (!raw) return null;
    try {
      const p = JSON.parse(b64decode(raw));
      const valid = typeof p.n === 'string'
        && /^\d{4}-\d{2}-\d{2}$/.test(p.d)
        && Array.isArray(p.s) && p.s.length === 9
        && p.s.every(x => Array.isArray(x) && Number.isInteger(x[0]) && x[0] >= 1 && x[0] <= 15 && CLUBS[x[1]]);
      return valid ? { name: p.n.slice(0, 20), key: p.d, scores: p.s } : null;
    } catch (e) {
      return null;
    }
  }

  // ==========================================
  // 6. STORAGE & APP STATE
  // ==========================================
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { records: {} }; }
    catch (e) { return { records: {} }; }
  }
  function save() {
    if (app.mode === 'practice') return;
    const keys = Object.keys(app.store.records).sort();
    while (keys.length > 60) delete app.store.records[keys.shift()];
    try { localStorage.setItem(STORE_KEY, JSON.stringify(app.store)); } catch (e) {}
  }
  function newRecord(name) {
    return { playerName: name, scores: [], mulliganAvailable: true, completed: false, startedAt: new Date().toISOString() };
  }
  function currentStreak() {
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 365; i++) {
      const rec = app.store.records[dateKeyFor(d)];
      if (rec?.completed) streak++;
      else if (i > 0) break;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }
  function currentHole() {
    return app.course[app.record ? app.record.scores.length : 0];
  }

  const app = {
    store: loadStore(),
    mode: 'daily',       // 'daily' | 'challenge' | 'practice'
    key: null,
    course: [],
    opponent: null,      // { name, scores[] }
    record: null,        // live reference to the saved round
    selectedClub: null,
    peeked: false,
    lastResult: null
  };

  // ==========================================
  // 7. BOOT
  // ==========================================
  function boot() {
    const ch = parseChallenge();
    const key = ch ? ch.key : TODAY;
    app.key = key;
    app.mode = ch ? 'challenge' : 'daily';
    app.course = buildCourse(key);

    app.opponent = ch
      ? {
          name: ch.name,
          scores: ch.scores.map(([strokes, code], i) => ({
            hole: i + 1,
            par: app.course[i].par,
            strokes,
            club: CLUBS[code],
            label: getScoreLabel(strokes, app.course[i].par)
          }))
        }
      : { name: 'Marcus', scores: simulateOpponent(app.course, key) };

    app.record = app.store.records[key] || null;
    renderLobby();
  }

  // Auto-refresh at midnight (or when the tab is revisited on a new day)
  function checkRollover() {
    if (!DEV_DAY && app.mode !== 'practice' && dateKeyFor() !== TODAY) location.reload();
  }
  setInterval(() => {
    const el = document.getElementById('countdown');
    if (el) el.textContent = timeToNextCourse();
    checkRollover();
  }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRollover(); });

  // ==========================================
  // 8. SHARED UI
