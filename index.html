<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>⛳ Brain Caddie — Trivia Meets Golf</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .fairway-gradient {
      background: linear-gradient(160deg, #064e3b 0%, #065f46 50%, #047857 100%);
    }
    .golf-ball {
      background: radial-gradient(circle at 30% 30%, #ffffff, #e2e8f0 70%, #94a3b8 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-start sm:items-center p-0 sm:p-4">

  <!-- Mobile App Container -->
  <div id="app" class="w-full max-w-md min-h-screen sm:min-h-[780px] sm:rounded-3xl overflow-hidden shadow-2xl flex flex-col bg-slate-50 text-slate-900 relative">
    
    <!-- Top Header -->
    <header class="fairway-gradient text-white px-5 pt-6 pb-5 shadow-md">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="text-2xl">⛳</span>
          <div>
            <h1 class="font-extrabold text-lg tracking-tight leading-none">BRAIN CADDIE</h1>
            <p class="text-emerald-200 text-xs font-medium mt-0.5" id="course-subtitle">Quick Nine · Clubhouse</p>
          </div>
        </div>
        <button onclick="toggleScorecard()" id="scorecard-btn" class="hidden bg-emerald-950/50 hover:bg-emerald-950/70 border border-emerald-400/30 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 transition">
          <span>📋 Card</span>
          <span id="header-score-badge" class="bg-amber-400 text-slate-950 px-1.5 py-0.5 rounded-full font-extrabold">E</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic View -->
    <main id="screen-container" class="flex-1 flex flex-col p-5 overflow-y-auto">
      <!-- Content injected by JS -->
    </main>

    <!-- Scorecard Drawer Modal -->
    <div id="scorecard-modal" class="hidden fixed inset-0 bg-slate-950/70 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[85vh] overflow-y-auto animate-fade-in">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-extrabold text-lg text-slate-900">📋 Match Scorecard</h3>
          <button onclick="toggleScorecard()" class="text-slate-400 hover:text-slate-700 font-bold text-xl px-2">&times;</button>
        </div>
        <div id="scorecard-content"></div>
        <button onclick="toggleScorecard()" class="mt-5 w-full py-3 bg-slate-900 text-white font-bold rounded-xl">Back to Course</button>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. COURSE DATA (Sample 9-Hole Course)
    // ==========================================
    const COURSE_HOLES = [
      {
        hole: 1,
        category: "Language",
        tag: "Warm-up",
        par: 3,
        question: "Which word is closest in meaning to 'ubiquitous'?",
        answer: "Everywhere",
        acceptedAnswers: ["everywhere", "omnipresent", "all over"],
        ironOptions: ["Rare", "Everywhere", "Temporary"],
        wedgeOptions: ["Rare", "Everywhere", "Temporary", "Questionable"],
        hint: "Think of smartphones or Wi-Fi—something you see no matter where you go.",
        fact: "Ubiquitous comes from the Latin 'ubique', meaning 'everywhere'—a staple word in business strategy decks."
      },
      {
        hole: 2,
        category: "Science",
        tag: "Standard",
        par: 4,
        question: "Which planet in our solar system has the shortest day?",
        answer: "Jupiter",
        acceptedAnswers: ["jupiter"],
        ironOptions: ["Mars", "Jupiter", "Saturn"],
        wedgeOptions: ["Earth", "Mars", "Jupiter", "Saturn"],
        hint: "Despite being the largest planet, this gas giant spins once every ~9.9 hours.",
        fact: "Jupiter rotates so fast (nearly 28,000 mph at its equator) that a full day lasts just 9 hours and 55 minutes."
      },
      {
        hole: 3,
        category: "Business",
        tag: "Standard",
        par: 4,
        question: "In finance and business, what does CAGR stand for?",
        answer: "Compound Annual Growth Rate",
        acceptedAnswers: ["compound annual growth rate", "compounded annual growth rate"],
        ironOptions: ["Compound Annual Growth Rate", "Cumulative Asset Growth Ratio", "Capital Allocation Growth Return"],
        wedgeOptions: ["Compound Annual Growth Rate", "Cumulative Asset Growth Ratio", "Capital Allocation Growth Return", "Corporate Annual Gross Revenue"],
        hint: "It measures the smoothed yearly rate of return over multiple time periods.",
        fact: "CAGR smooths out volatile year-to-year swings so investors can compare the steady growth of two assets."
      },
      {
        hole: 4,
        category: "Geography",
        tag: "Signature Hole",
        par: 5,
        question: "Which country has the most natural lakes in the world?",
        answer: "Canada",
        acceptedAnswers: ["canada"],
        ironOptions: ["Canada", "Finland", "Russia"],
        wedgeOptions: ["Canada", "Finland", "Russia", "Sweden"],
        hint: "This North American nation holds over 60% of the world's natural lakes.",
        fact: "Canada has more lakes than any other country, with estimates putting the number above 2 million depending on size thresholds."
      },
      {
        hole: 5,
        category: "Food",
        tag: "Short Par 3",
        par: 3,
        question: "What Japanese word describes the savory 'fifth taste'?",
        answer: "Umami",
        acceptedAnswers: ["umami"],
        ironOptions: ["Umami", "Dashi", "Koji"],
        wedgeOptions: ["Umami", "Dashi", "Koji", "Mirin"],
        hint: "Found in aged cheese, mushrooms, and soy sauce; it translates roughly to 'pleasant savory taste'.",
        fact: "Identified in 1908 by chemist Kikunae Ikeda, umami detects glutamates and signals protein-rich foods."
      },
      {
        hole: 6,
        category: "Technology",
        tag: "Standard",
        par: 4,
        question: "What does 'HTTP' stand for in a website address?",
        answer: "Hypertext Transfer Protocol",
        acceptedAnswers: ["hypertext transfer protocol", "hyper text transfer protocol"],
        ironOptions: ["Hypertext Transfer Protocol", "Hyperlink Transmission Process", "High-Tech Transfer Portal"],
        wedgeOptions: ["Hypertext Transfer Protocol", "Hyperlink Transmission Process", "High-Tech Transfer Portal", "Host Terminal Transfer Protocol"],
        hint: "Tim Berners-Lee coined it in 1989 as the foundation of data communication for the World Wide Web.",
        fact: "Adding the 'S' in HTTPS encrypts those hypertext transfers using TLS so sensitive workplace data stays private."
      },
      {
        hole: 7,
        category: "History",
        tag: "Chronology",
        par: 3,
        question: "Which of these inventions was patented or demonstrated first?",
        answer: "The telephone",
        acceptedAnswers: ["telephone", "the telephone"],
        ironOptions: ["The telephone", "The light bulb", "The airplane"],
        wedgeOptions: ["The telephone", "The light bulb", "The airplane", "Radio broadcasting"],
        hint: "Alexander Graham Bell secured his patent in 1876—three years before Edison's commercial bulb.",
        fact: "The telephone came first (1876), followed by the incandescent light bulb (1879), radio (1895), and powered flight (1903)."
      },
      {
        hole: 8,
        category: "Numbers",
        tag: "Mental Math",
        par: 5,
        question: "Without a calculator: Roughly what percentage is 1/6 (rounded to the nearest whole percent)?",
        answer: "17%",
        acceptedAnswers: ["17", "17%", "16.7", "16.7%", "16.67", "16.67%"],
        ironOptions: ["12%", "17%", "25%"],
        wedgeOptions: ["8%", "12%", "17%", "25%"],
        hint: "Half of 1/3 (33.3%) gives you the exact figure.",
        fact: "1/6 equals 16.666...%, a handy mental benchmark when estimating splits or probabilities in meetings."
      },
      {
        hole: 9,
        category: "Wildcard",
        tag: "Championship Hole",
        par: 4,
        question: "In game theory, what is the name of a state where no player can benefit by changing their strategy unilaterally?",
        answer: "Nash equilibrium",
        acceptedAnswers: ["nash equilibrium", "nash"],
        ironOptions: ["Nash equilibrium", "Pareto efficiency", "Prisoner's dilemma"],
        wedgeOptions: ["Nash equilibrium", "Pareto efficiency", "Prisoner's dilemma", "Zero-sum state"],
        hint: "Named after mathematician John Nash, featured in the film 'A Beautiful Mind'.",
        fact: "A Nash equilibrium occurs when every player's strategy is optimal given the strategies everyone else has chosen."
      }
    ];

    // ==========================================
    // 2. GAME STATE
    // ==========================================
    let state = {
      playerName: "",
      opponentName: "Marcus",
      opponentScores: [],
      currentHoleIndex: 0,
      playerScores: [],
      mulliganAvailable: true,
      peekedCurrentHole: false,
      selectedClub: null,
      lastShotResult: null,
      isChallengeMode: false
    };

    function initFromURL() {
      const params = new URLSearchParams(window.location.search);
      const challengeData = params.get("c");
      if (challengeData) {
        try {
          const decoded = JSON.parse(atob(challengeData));
          if (decoded.name && Array.isArray(decoded.scores)) {
            state.opponentName = decoded.name;
            state.opponentScores = decoded.scores;
            state.isChallengeMode = true;
          }
        } catch (e) {
          console.warn("Invalid challenge link, falling back to default opponent.");
        }
      }
      if (!state.isChallengeMode) {
        state.opponentName = "Marcus";
        state.opponentScores = [
          { hole: 1, par: 3, strokes: 2, club: "Driver", label: "Birdie 🐦" },
          { hole: 2, par: 4, strokes: 4, club: "Wedge", label: "Par" },
          { hole: 3, par: 4, strokes: 3, club: "Iron", label: "Birdie 🐦" },
          { hole: 4, par: 5, strokes: 5, club: "Wedge", label: "Par" },
          { hole: 5, par: 3, strokes: 3, club: "Iron", label: "Par" },
          { hole: 6, par: 4, strokes: 2, club: "Driver", label: "Eagle 🦅" },
          { hole: 7, par: 3, strokes: 4, club: "Driver", label: "Bogey 😬" },
          { hole: 8, par: 5, strokes: 4, club: "Iron", label: "Birdie 🐦" },
          { hole: 9, par: 4, strokes: 4, club: "Wedge", label: "Par" }
        ];
      }
      renderLobby();
    }

    // ==========================================
    // 3. SCORING HELPERS
    // ==========================================
    function formatRelScore(rel) {
      if (rel === 0) return "E";
      return rel > 0 ? `+${rel}` : `${rel}`;
    }
    function getPlayerRelativeScore() {
      return state.playerScores.reduce((acc, s) => acc + (s.strokes - s.par), 0);
    }
    function getOpponentRelativeScore(upToHoleCount = 9) {
      return state.opponentScores
        .slice(0, upToHoleCount)
        .reduce((acc, s) => acc + (s.strokes - s.par), 0);
    }
    function getScoreLabel(strokes, par) {
      const diff = strokes - par;
      if (strokes === 1) return "Hole-in-One! 🏆";
      if (diff <= -2) return "Eagle 🦅";
      if (diff === -1) return "Birdie 🐦";
      if (diff === 0) return "Par ⛳";
      return "Bogey 😬";
    }
    function updateHeader() {
      const btn = document.getElementById("scorecard-btn");
      const badge = document.getElementById("header-score-badge");
      const sub = document.getElementById("course-subtitle");
      if (state.playerName && state.currentHoleIndex < COURSE_HOLES.length) {
        btn.classList.remove("hidden");
        badge.textContent = formatRelScore(getPlayerRelativeScore());
        sub.textContent = `Hole ${state.currentHoleIndex + 1} of 9 · vs ${state.opponentName}`;
      } else if (state.currentHoleIndex >= COURSE_HOLES.length) {
        btn.classList.remove("hidden");
        badge.textContent = formatRelScore(getPlayerRelativeScore());
        sub.textContent = "19th Hole · Final Clubhouse";
      } else {
        btn.classList.add("hidden");
        sub.textContent = "Quick Nine · Workplace Trivia Golf";
      }
    }

    // ==========================================
    // 4. SCREENS
    // ==========================================
    // SCREEN 1: LOBBY / CHALLENGE LANDING
    function renderLobby() {
      updateHeader();
      const oppTotal = getOpponentRelativeScore(9);
      const container = document.getElementById("screen-container");
      container.innerHTML = `
        <div class="animate-fade-in flex-1 flex flex-col justify-between">
          <div>
            <div class="inline-block bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full mb-3">
              ${state.isChallengeMode ? "📩 Direct Challenge Link" : "⚡ Featured Matchup"}
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Quick Nine · ~4 mins</h2>
            <p class="text-slate-600 text-sm mt-1">Test your professional acumen against the clubhouse leader.</p>

            <div class="bg-white border-2 border-slate-200 rounded-3xl p-5 shadow-sm mt-5">
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Challenger</span>
                <span class="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-0.5 rounded-full">Finished</span>
              </div>
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 golf-ball rounded-full flex items-center justify-center font-black text-slate-700 text-lg">🏌️</div>
                <div>
                  <h3 class="font-extrabold text-lg text-slate-900">${state.opponentName}</h3>
                  <p class="text-xs text-slate-500 font-medium">Finished at <strong class="text-slate-900">${formatRelScore(oppTotal)}</strong></p>
                </div>
              </div>
            </div>

            <div class="mt-6">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Your Golfer Nickname</label>
              <input id="nickname-input" type="text" placeholder="e.g. Par-fect Pro" maxlength="20" class="w-full px-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-900 focus:outline-none focus:border-emerald-600 transition" />
            </div>
          </div>

          <div class="mt-6">
            <button onclick="startMatch()" class="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-base">
              <span>🏌️ Tee Off · Hole 1</span>
            </button>

            <div class="grid grid-cols-3 gap-2 mt-4 text-center">
              <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                <div class="text-lg">🏌️</div>
                <p class="text-[10px] font-bold text-slate-700 mt-1">3 Club Options</p>
              </div>
              <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                <div class="text-lg">👀</div>
                <p class="text-[10px] font-bold text-slate-700 mt-1">Poker Peek</p>
              </div>
              <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                <div class="text-lg">🛟</div>
                <p class="text-[10px] font-bold text-slate-700 mt-1">1 Mulligan</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function startMatch() {
      const inputEl = document.getElementById("nickname-input");
      const input = inputEl ? inputEl.value.trim() : "";
      state.playerName = input || "You";
      state.currentHoleIndex = 0;
      state.playerScores = [];
      state.mulliganAvailable = true;
      renderClubSelection();
    }

    // SCREEN 2: TEE BOX (CLUB SELECTION + PEEK MECHANIC)
    function renderClubSelection() {
      updateHeader();
      state.peekedCurrentHole = false;
      state.selectedClub = null;
      const holeData = COURSE_HOLES[state.currentHoleIndex];
      const container = document.getElementById("screen-container");
      const eagleStrokes = Math.max(1, holeData.par - 2);

      container.innerHTML = `
        <div class="animate-fade-in flex-1 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-bold uppercase tracking-wider text-emerald-700">HOLE ${holeData.hole} · PAR ${holeData.par}</span>
              <span class="text-xs bg-slate-200 text-slate-700 font-bold px-2.5 py-0.5 rounded-full">${holeData.category} · ${holeData.tag}</span>
            </div>

            <div class="bg-white border-2 border-slate-200 rounded-3xl p-5 shadow-sm mb-4">
              <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">The Shot</span>
              <h3 class="text-lg font-extrabold text-slate-900 mt-1 leading-snug">${holeData.question}</h3>
            </div>

            <div id="peek-box" class="bg-emerald-950 text-emerald-100 rounded-2xl p-3.5 mb-4 flex items-center justify-between">
              <div class="text-xs">
                <span class="uppercase tracking-wider text-amber-400 font-bold text-[10px]">👀 Clubhouse Intel</span>
                <p class="font-medium text-xs mt-0.5">${state.opponentName} already played Hole ${holeData.hole}.</p>
              </div>
              <button onclick="triggerPeek()" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs px-3 py-1.5 rounded-xl transition shadow">
                Peek Score
              </button>
            </div>

            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Select Your Club</p>
            <div class="space-y-2.5">
              <button onclick="selectClub('Driver')" class="w-full text-left bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-600 rounded-2xl p-3.5 transition flex items-center justify-between group">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-base">🏌️</span>
                    <span class="font-extrabold text-slate-900">Driver</span>
                    <span class="text-[10px] bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded">High Risk</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-0.5">No choices · Type exact answer</p>
                </div>
                <div class="text-right">
                  <span class="text-xs font-extrabold text-emerald-700">${eagleStrokes === 1 ? 'Hole-in-1 🏆' : 'Eagle 🦅 (-2)'}</span>
                  <p class="text-[10px] text-slate-400">Miss: +1 Bogey</p>
                </div>
              </button>

              <button onclick="selectClub('Iron')" class="w-full text-left bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-600 rounded-2xl p-3.5 transition flex items-center justify-between group">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-base">🏌️‍♂️</span>
                    <span class="font-extrabold text-slate-900">Iron</span>
                    <span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">Medium</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-0.5">3 multiple-choice options</p>
                </div>
                <div class="text-right">
                  <span class="text-xs font-extrabold text-emerald-700">Birdie 🐦 (-1)</span>
                  <p class="text-[10px] text-slate-400">Miss: +1 Bogey</p>
                </div>
              </button>

              <button id="wedge-btn" onclick="selectClub('Wedge')" class="w-full text-left bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-600 rounded-2xl p-3.5 transition flex items-center justify-between group">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-base">🥄</span>
                    <span class="font-extrabold text-slate-900">Wedge</span>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">Safe</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-0.5">4 choices + Caddie Hint</p>
                </div>
                <div class="text-right">
                  <span class="text-xs font-extrabold text-emerald-700">Par ⛳ (E)</span>
                  <p class="text-[10px] text-slate-400">Miss: +1 Bogey</p>
                </div>
              </button>
            </div>
          </div>

          <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-200 text-xs text-slate-500 font-medium">
            <span>Mulligan: ${state.mulliganAvailable ? '1 Available 🛟' : 'Used'}</span>
            <span>Your Score: <strong class="text-slate-900">${formatRelScore(getPlayerRelativeScore())}</strong></span>
          </div>
        </div>
      `;
    }

    function triggerPeek() {
      state.peekedCurrentHole = true;
      const oppHole = state.opponentScores[state.currentHoleIndex];
      const peekBox = document.getElementById("peek-box");
      const wedgeBtn = document.getElementById("wedge-btn");

      peekBox.className = "bg-slate-900 text-white rounded-2xl p-3.5 mb-4 flex items-center justify-between animate-fade-in";
      peekBox.innerHTML = `
        <div class="text-xs">
          <span class="uppercase tracking-wider text-amber-400 font-bold text-[10px]">👀 Caddie Intel</span>
          <p class="font-bold text-sm mt-0.5">${state.opponentName} used ${oppHole.club} → <span class="text-emerald-400">${oppHole.label}</span></p>
        </div>
        <span class="text-xs bg-white/10 px-2.5 py-1 rounded-lg font-semibold">Wedge Locked</span>
      `;

      wedgeBtn.disabled = true;
      wedgeBtn.className = "w-full text-left bg-slate-100 border-2 border-slate-200 rounded-2xl p-3.5 opacity-50 cursor-not-allowed flex items-center justify-between";
      wedgeBtn.querySelector("p").textContent = "Sacrificed to peek at opponent's shot";
    }

    function selectClub(club) {
      if (club === "Wedge" && state.peekedCurrentHole) return;
      state.selectedClub = club;
      renderShotScreen();
    }

    // SCREEN 3: TAKING THE SHOT (ANSWERING)
    function renderShotScreen() {
      const holeData = COURSE_HOLES[state.currentHoleIndex];
      const club = state.selectedClub;
      const container = document.getElementById("screen-container");
      let inputAreaHTML = "";

      if (club === "Driver") {
        inputAreaHTML = `
          <div class="space-y-3 mt-4">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Type Your Answer</label>
            <input id="driver-answer" type="text" placeholder="Type answer here..." class="w-full px-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-900 focus:outline-none focus:border-emerald-600 transition" onkeydown="if(event.key==='Enter') submitDriverShot()" />
            <button onclick="submitDriverShot()" class="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold rounded-2xl shadow transition">
              🏌️ Swing Driver
            </button>
          </div>
        `;
      } else if (club === "Iron") {
        inputAreaHTML = `
          <div class="space-y-2.5 mt-4">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Choose One (Birdie Shot)</label>
            ${holeData.ironOptions.map(opt => `
              <button onclick="evaluateShot('${opt.replace(/'/g, "\\'")}')" class="w-full text-left px-4 py-3.5 bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-600 rounded-xl font-bold text-slate-800 transition">
                ${opt}
              </button>
            `).join("")}
          </div>
        `;
      } else if (club === "Wedge") {
        inputAreaHTML = `
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 my-3 text-xs text-emerald-900 font-medium">
            🧢 <strong>Caddie Tip:</strong> ${holeData.hint}
          </div>
          <div class="space-y-2.5 mt-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Choose One (Par Shot)</label>
            ${holeData.wedgeOptions.map(opt => `
              <button onclick="evaluateShot('${opt.replace(/'/g, "\\'")}')" class="w-full text-left px-4 py-3 bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-600 rounded-xl font-bold text-slate-800 transition">
                ${opt}
              </button>
            `).join("")}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="animate-fade-in flex-1 flex flex-col justify-between">
          <div>
            <button onclick="renderClubSelection()" class="text-xs text-emerald-700 font-bold mb-3 flex items-center gap-1 hover:underline">
              ← Change Club
            </button>

            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Club: <strong class="text-slate-900">${club}</strong></span>
              <span class="text-xs bg-slate-200 text-slate-700 font-bold px-2.5 py-0.5 rounded-full">Hole ${holeData.hole} · Par ${holeData.par}</span>
            </div>

            <div class="bg-white border-2 border-slate-200 rounded-3xl p-5 shadow-sm">
              <h3 class="text-lg font-extrabold text-slate-900 leading-snug">${holeData.question}</h3>
            </div>

            ${inputAreaHTML}
          </div>
        </div>
      `;

      if (club === "Driver") {
        setTimeout(() => document.getElementById("driver-answer")?.focus(), 50);
      }
    }

    function submitDriverShot() {
      const inputEl = document.getElementById("driver-answer");
      const val = inputEl ? inputEl.value.trim() : "";
      if (!val) return;
      evaluateShot(val);
    }

    function evaluateShot(userAnswer) {
      const holeData = COURSE_HOLES[state.currentHoleIndex];
      const club = state.selectedClub;
      const normalized = userAnswer.trim().toLowerCase();
      let isCorrect = false;

      if (club === "Driver") {
        isCorrect = holeData.acceptedAnswers.some(ans => normalized === ans.toLowerCase());
      } else {
        isCorrect = normalized === holeData.answer.toLowerCase();
      }

      let strokes;
      if (isCorrect) {
        if (club === "Driver") strokes = Math.max(1, holeData.par - 2);
        else if (club === "Iron") strokes = holeData.par - 1;
        else strokes = holeData.par;
      } else {
        strokes = holeData.par + 1;
      }

      const label = getScoreLabel(strokes, holeData.par);
      state.lastShotResult = {
        hole: holeData.hole,
        par: holeData.par,
        club,
        userAnswer,
        isCorrect,
        strokes,
        label,
        correctAnswer: holeData.answer,
        fact: holeData.fact
      };

      renderShotOutcome();
    }

    // SCREEN 4: SHOT OUTCOME + MICRO-LEARNING + MULLIGAN
    function renderShotOutcome() {
      const res = state.lastShotResult;
      const oppHole = state.opponentScores[state.currentHoleIndex];
      const container = document.getElementById("screen-container");

      if (!res.isCorrect && state.mulliganAvailable) {
        container.innerHTML = `
          <div class="animate-fade-in flex-1 flex flex-col justify-between">
            <div class="text-center pt-4">
              <div class="w-16 h-16 bg-amber-100 text-amber-700 rounded-full mx-auto mb-3 flex items-center justify-center text-2xl shadow-inner">🏖️</div>
              <h2 class="text-2xl font-extrabold text-slate-900">Into the Bunker!</h2>
              <p class="text-slate-600 text-sm mt-1">Your ${res.club} shot ("${res.userAnswer}") missed the green. That's a Bogey (+1).</p>
            </div>

            <div class="bg-white border-2 border-slate-200 rounded-3xl p-5 my-4">
              <h4 class="font-bold text-slate-900 text-sm mb-1">Use Your Mulligan?</h4>
              <p class="text-xs text-slate-500">You get 1 Mulligan per match to replay a hole from the tee box.</p>
            </div>

            <div class="space-y-2.5">
              <button onclick="useMulligan()" class="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold rounded-2xl shadow transition">
                🛟 Use Mulligan & Replay Hole
              </button>
              <button onclick="acceptBogey()" class="w-full py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-2xl transition">
                Take the Bogey (+1)
              </button>
            </div>
          </div>
        `;
        return;
      }

      recordCurrentHoleScore();
      const playerTotalRel = getPlayerRelativeScore();
      const oppTotalSoFarRel = getOpponentRelativeScore(state.currentHoleIndex + 1);
      const isLastHole = state.currentHoleIndex === COURSE_HOLES.length - 1;

      container.innerHTML = `
        <div class="animate-fade-in flex-1 flex flex-col justify-between">
          <div>
            <div class="${res.isCorrect ? 'fairway-gradient text-white' : 'bg-slate-800 text-white'} rounded-3xl p-6 text-center shadow-lg mb-4">
              <div class="w-12 h-12 golf-ball rounded-full mx-auto mb-3 flex items-center justify-center text-xl">
                ${res.isCorrect ? '⛳' : '😬'}
              </div>
              <p class="text-xs uppercase tracking-widest font-bold opacity-85">Hole ${res.hole} Result</p>
              <h2 class="text-2xl font-extrabold mt-1">${res.label}</h2>
              <p class="text-xs opacity-90 mt-1">
                ${res.isCorrect 
                  ? `Nice shot! You're now <strong>${formatRelScore(playerTotalRel)}</strong>.`
                  : `Correct answer: <strong>${res.correctAnswer}</strong>. You're now <strong>${formatRelScore(playerTotalRel)}</strong>.`}
              </p>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-4">
              <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-700">💡 Caddie Note</span>
              <p class="text-xs text-slate-700 mt-1 leading-relaxed">${res.fact}</p>
            </div>

            <div class="bg-slate-100 rounded-2xl p-3.5 text-xs text-slate-600 flex justify-between items-center">
              <span>On Hole ${res.hole}: <strong class="text-slate-900">${state.opponentName}</strong> scored ${oppHole.label} (${oppHole.club})</span>
            </div>
          </div>

          <div>
            <div class="text-center text-xs font-semibold text-slate-500 mb-3">
              Match Pace: You <strong class="text-slate-900">${formatRelScore(playerTotalRel)}</strong> · ${state.opponentName} <strong class="text-slate-900">${formatRelScore(oppTotalSoFarRel)}</strong>
            </div>
            <button onclick="nextHole()" class="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold rounded-2xl shadow transition">
              ${isLastHole ? '🏆 Finish Round & View Leaderboard' : `Next: Hole ${res.hole + 1} →`}
            </button>
          </div>
        </div>
      `;
    }

    function useMulligan() {
      state.mulliganAvailable = false;
      renderClubSelection();
    }

    function acceptBogey() {
      const res = state.lastShotResult;
      recordCurrentHoleScore();
      const playerTotalRel = getPlayerRelativeScore();
      const oppHole = state.opponentScores[state.currentHoleIndex];
      const oppTotalSoFarRel = getOpponentRelativeScore(state.currentHoleIndex + 1);
      const isLastHole = state.currentHoleIndex === COURSE_HOLES.length - 1;
      const container = document.getElementById("screen-container");

      container.innerHTML = `
        <div class="animate-fade-in flex-1 flex flex-col justify-between">
          <div>
            <div class="bg-slate-800 text-white rounded-3xl p-6 text-center shadow-lg mb-4">
              <div class="w-12 h-12 golf-ball rounded-full mx-auto mb-3 flex items-center justify-center text-xl">😬</div>
              <p class="text-xs uppercase tracking-widest font-bold opacity-80">Hole ${res.hole} Result</p>
              <h2 class="text-2xl font-extrabold mt-1">${res.label}</h2>
              <p class="text-xs opacity-90 mt-1">Correct answer: <strong>${res.correctAnswer}</strong>. You're now <strong>${formatRelScore(playerTotalRel)}</strong>.</p>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-4">
              <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-700">💡 Caddie Note</span>
              <p class="text-xs text-slate-700 mt-1 leading-relaxed">${res.fact}</p>
            </div>
          </div>

          <div>
            <button onclick="nextHole()" class="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold rounded-2xl shadow transition">
              ${isLastHole ? '🏆 Finish Round & View Leaderboard' : `Next: Hole ${res.hole + 1} →`}
            </button>
          </div>
        </div>
      `;
    }

    function recordCurrentHoleScore() {
      const res = state.lastShotResult;
      if (state.playerScores.length === state.currentHoleIndex) {
        state.playerScores.push({
          hole: res.hole,
          par: res.par,
          strokes: res.strokes,
          club: res.club,
          label: res.label
        });
      }
      updateHeader();
    }

    function nextHole() {
      state.currentHoleIndex++;
      if (state.currentHoleIndex < COURSE_HOLES.length) {
        renderClubSelection();
      } else {
        renderClubhouseSummary();
      }
    }

    // SCREEN 5: 19TH HOLE LEADERBOARD & SHARE CHALLENGE LINK
    function renderClubhouseSummary() {
      updateHeader();
      const playerRel = getPlayerRelativeScore();
      const oppRel = getOpponentRelativeScore(9);

      const leaderboard = [
        { name: state.playerName, score: playerRel, isUser: true },
        { name: state.opponentName, score: oppRel, isUser: false },
        { name: "Albert", score: 2, isUser: false },
        { name: "Emily", score: 4, isUser: false }
      ].sort((a, b) => a.score - b.score);

      const userWon = playerRel < oppRel;
      const tied = playerRel === oppRel;
      const headline = userWon
        ? `🏆 You beat ${state.opponentName}!`
        : tied
        ? `🤝 Tied with ${state.opponentName}!`
        : `⛳ ${state.opponentName} edged you out!`;

      const payload = btoa(JSON.stringify({
        name: state.playerName,
        scores: state.playerScores
      }));
      const shareURL = `${window.location.origin}${window.location.pathname}?c=${payload}`;
      const container = document.getElementById("screen-container");

      container.innerHTML = `
        <div class="animate-fade-in flex-1 flex flex-col justify-between">
          <div>
            <div class="fairway-gradient text-white rounded-3xl p-6 text-center shadow-lg mb-5">
              <span class="text-xs uppercase tracking-widest font-extrabold opacity-80">19th Hole Clubhouse</span>
              <h2 class="text-xl font-extrabold mt-1">${headline}</h2>
              <div class="flex justify-center gap-6 mt-4 pt-4 border-t border-white/20 text-center">
                <div>
                  <p class="text-[10px] uppercase opacity-75">${state.playerName}</p>
                  <p class="text-xl font-black">${formatRelScore(playerRel)}</p>
                </div>
                <div class="border-r border-white/20"></div>
                <div>
                  <p class="text-[10px] uppercase opacity-75">${state.opponentName}</p>
                  <p class="text-xl font-black">${formatRelScore(oppRel)}</p>
                </div>
              </div>
            </div>

            <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Office Leaderboard</p>
            <div class="space-y-2 mb-5">
              ${leaderboard.map((entry, idx) => {
                const medals = ["🥇", "🥈", "🥉", "4th"];
                return `
                  <div class="flex items-center justify-between px-3.5 py-2.5 rounded-2xl ${entry.isUser ? 'bg-emerald-50 border-2 border-emerald-300 font-extrabold' : 'bg-white border border-slate-200 font-semibold'} text-sm shadow-sm">
                    <div class="flex items-center gap-2.5">
                      <span>${medals[idx] || (idx + 1) + 'th'}</span>
                      <span class="text-slate-900">${entry.name} ${entry.isUser ? '(You)' : ''}</span>
                    </div>
                    <span class="${entry.score < 0 ? 'text-emerald-700' : entry.score > 0 ? 'text-rose-600' : 'text-slate-700'} font-black">
                      ${formatRelScore(entry.score)}
                    </span>
                  </div>
                `;
              }).join("")}
            </div>

            <div class="bg-slate-100 rounded-2xl p-4 border border-slate-200">
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-500 block mb-1">📲 Challenge a Colleague</span>
              <p class="text-xs text-slate-600 mb-3">Send this link in Slack, Teams, or WhatsApp so they can play against your exact 9-hole scorecard:</p>
              <button id="copy-btn" onclick="copyChallengeLink('${shareURL}')" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition shadow">
                📋 Copy Challenge Link (${formatRelScore(playerRel)})
              </button>
            </div>
          </div>

          <div class="space-y-2.5 mt-5">
            <button onclick="toggleScorecard()" class="w-full py-3 bg-white hover:bg-slate-100 border-2 border-slate-200 text-slate-800 font-bold rounded-xl text-xs transition">
              📋 View Full Scorecard
            </button>
            <button onclick="rematch()" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl text-xs transition shadow">
              🔄 Rematch
            </button>
          </div>
        </div>
      `;
    }

    function copyChallengeLink(url) {
      const shareText = `⛳ ${state.playerName} just finished the Brain Caddie Quick Nine at ${formatRelScore(getPlayerRelativeScore())}. Think you can beat me?\n${url}`;
      navigator.clipboard.writeText(shareText).then(() => {
        const btn = document.getElementById("copy-btn");
        btn.textContent = "✅ Copied Invite to Clipboard!";
        btn.classList.replace("bg-slate-900", "bg-emerald-700");
      });
    }

    function rematch() {
      state.currentHoleIndex = 0;
      state.playerScores = [];
      state.mulliganAvailable = true;
      renderClubSelection();
    }

    // ==========================================
    // 5. SCORECARD MODAL
    // ==========================================
    function toggleScorecard() {
      const modal = document.getElementById("scorecard-modal");
      const content = document.getElementById("scorecard-content");
      if (modal.classList.contains("hidden")) {
        content.innerHTML = `
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="border-b border-slate-200 text-slate-400 font-bold">
                  <th class="pb-2">Hole</th>
                  <th class="pb-2">Par</th>
                  <th class="pb-2">${state.playerName || 'You'}</th>
                  <th class="pb-2">${state.opponentName}</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-medium">
                ${COURSE_HOLES.map((h, i) => {
                  const p = state.playerScores[i];
                  const o = state.opponentScores[i];
                  return `
                    <tr>
                      <td class="py-2.5 font-bold text-slate-900">#${h.hole} <span class="font-normal text-slate-400">(${h.category})</span></td>
                      <td class="py-2.5 text-slate-600">${h.par}</td>
                      <td class="py-2.5 font-bold text-emerald-700">${p ? `${p.strokes} (${p.club})` : '—'}</td>
                      <td class="py-2.5 text-slate-700">${p || state.currentHoleIndex >= 9 ? `${o.strokes} (${o.club})` : 'Hidden'}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
        modal.classList.remove("hidden");
      } else {
        modal.classList.add("hidden");
      }
    }

    // Boot App
    initFromURL();
  </script>
</body>
</html>
