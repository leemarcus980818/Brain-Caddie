// Check URL for shared challenge payload (?c=base64)
function initFromURL() {
const params = new URLSearchParams(window.location.search);
const challengeData = params.get("c");
if (challengeData) {
try {
const decoded = JSON.parse(atob(challengeData));
if (decoded.name && Array.isArray(decoded.scores)) {
state.opponentName = decoded.name;
state.opponentScores = decoded.scores;
state.isChallengeMode = true;
}
} catch (e) {
console.warn("Invalid challenge link, falling back to default opponent.");
}
}
// If no real challenge link, seed realistic async opponent (Marcus) so Peek & Leaderboard work immediately
if (!state.isChallengeMode) {
state.opponentName = "Marcus";
state.opponentScores = [
{ hole: 1, par: 3, strokes: 2, club: "Driver", label: "Birdie 🐦" },

// ==========================================
// 3. SCORING HELPERS
// ==========================================
function formatRelScore(rel) {
if (rel === 0) return "E";
return rel > 0 ? +${rel} : ${rel};
}
function getPlayerRelativeScore() {
return state.playerScores.reduce((acc, s) => acc + (s.strokes - s.par), 0);
}
function getOpponentRelativeScore(upToHoleCount = 9) {
return state.opponentScores
.slice(0, upToHoleCount)
.reduce((acc, s) => acc + (s.strokes - s.par), 0);
}
function getScoreLabel(strokes, par) {
const diff = strokes - par;
if (strokes === 1) return "Hole-in-One! 🏆";
if (diff <= -2) return "Eagle 🦅";
if (diff === -1) return "Birdie 🐦";
if (diff === 0) return "Par ⛳";
return "Bogey 😬";
}
function updateHeader() {
const btn = document.getElementById("scorecard-btn");
const badge = document.getElementById("header-score-badge");
const sub = document.getElementById("course-subtitle");
if (state.playerName && state.currentHoleIndex < COURSE_HOLES.length) {
btn.classList.remove("hidden");
badge.textContent = formatRelScore(getPlayerRelativeScore());
sub.textContent = Hole ${state.currentHoleIndex + 1} of 9 · vs ${state.opponentName};
} else if (state.currentHoleIndex >= COURSE_HOLES.length) {
btn.classList.remove("hidden");
badge.textContent = formatRelScore(getPlayerRelativeScore());
sub.textContent = 19th Hole · Final Clubhouse;
} else {
btn.classList.add("hidden");
sub.textContent = "Quick Nine · Workplace Trivia Golf";
}
}

function submitDriverShot() {
const val = document.getElementById("driver-answer").value.trim();
if (!val) return;
evaluateShot(val);
}
function evaluateShot(userAnswer) {
const holeData = COURSE_HOLES[state.currentHoleIndex];
const club = state.selectedClub;
const normalized = userAnswer.trim().toLowerCase();
let isCorrect = false;
if (club === "Driver") {
isCorrect = holeData.acceptedAnswers.some(ans => normalized === ans.toLowerCase());
} else {
isCorrect = normalized === holeData.answer.toLowerCase();
}
let strokes;
if (isCorrect) {
if (club === "Driver") strokes = Math.max(1, holeData.par - 2);
else if (club === "Iron") strokes = holeData.par - 1;
else strokes = holeData.par;
} else {
strokes = holeData.par + 1;
}
const label = getScoreLabel(strokes, holeData.par);
state.lastShotResult = {
hole: holeData.hole,
par: holeData.par,
club,
userAnswer,
isCorrect,
strokes,
label,
correctAnswer: holeData.answer,
fact: holeData.fact
};
renderShotOutcome();
}

function recordCurrentHoleScore() {
const res = state.lastShotResult;
// Avoid duplicate push if re-rendered
if (state.playerScores.length === state.currentHoleIndex) {
state.playerScores.push({
hole: res.hole,
par: res.par,
strokes: res.strokes,
club: res.club,
label: res.label
});
}
updateHeader();
}
function nextHole() {
state.currentHoleIndex++;
if (state.currentHoleIndex < COURSE_HOLES.length) {
renderClubSelection();
} else {
renderClubhouseSummary();
}
}

function copyChallengeLink(url) {
const shareText = ⛳ ${state.playerName} just finished the Brain Caddie Quick Nine at ${formatRelScore(getPlayerRelativeScore())}. Think you can beat me?\n${url};
navigator.clipboard.writeText(shareText).then(() => {
const btn = document.getElementById("copy-btn");
btn.textContent = "✅ Copied Invite to Clipboard!";
btn.classList.replace("bg-slate-900", "bg-emerald-700");
